[project]
name = "comfyui-budgetpixel"
description = "Official BudgetPixel nodes for ComfyUI — generate images, video, music and sound effects with 60+ hosted models (FLUX, Seedream, Kling, Seedance, Wan, and more) using your BudgetPixel API key."
version = "0.1.5"
license = { file = "LICENSE" }
dependencies = ["requests"]
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/budgetpixel-ai/comfyui-budgetpixel"
Documentation = "https://docs.budgetpixel.com/comfyui"
Homepage = "https://budgetpixel.com/plugins/comfyui"

[tool.comfy]
PublisherId = "budgetpixel-ai"
DisplayName = "BudgetPixel"
Icon = "https://raw.githubusercontent.com/budgetpixel-ai/comfyui-budgetpixel/main/assets/icon.png"
